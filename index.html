<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOVA ACADEMY | Web Data Entry Tools 2026</title>  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="home" class="hero d-flex align-items-center">
    <div class="container text-center">
      <h1 class="neon-text display-2 fw-bold">Nova Academy</h1>
      <div class="search-box-wrapper mx-auto mt-4" style="max-width:600px;">
        <input type="text" id="searchInput" class="form-control rounded-pill p-3" placeholder="Search workshops (XPS, XRD)...">
      </div>
    </div>
  </header>

  <section class="container py-5" id="workshops">
    <h2 class="neon-text text-center mb-5">Upcoming Workshops</h2>
    <div class="row g-4" id="workshopGrid"></div> </section>

  <section class="container py-5 bg-dark text-white" id="training">
    <h2 class="neon-text text-center mb-5">Meet Our Trainers</h2>
    <div class="row g-4" id="trainerGrid"></div> </section>

  <div id="workshopDetailsPopup" class="popup-overlay">
    <div class="popup-box" style="max-width:700px;">
      <span class="close-x" onclick="closePopup('workshopDetailsPopup')">&times;</span>
      <div id="dynamicDetailContent"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
