<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workshop Website</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

  <div id="header"></div>
  <div id="workshops"></div>
  <div id="trainers"></div>
  <div id="footer"></div>
  <div id="enquiryModal"></div>

  <script src="js/script.js"></script>
  <script src="js/workshop-bind.js"></script>
  <script src="js/form-handler.js"></script>

  <script>
    function load(id, file) {
      fetch(file).then(r => r.text()).then(d => {
        document.getElementById(id).innerHTML = d;
      });
    }

    load("header", "components/header.html");
    load("workshops", "components/workshop-section.html");
    load("trainers", "components/trainer-section.html");
    load("footer", "components/footer.html");
    load("enquiryModal", "components/enquiry-modal.html");
  </script>

</body>
</html>
