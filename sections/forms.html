<!-- ================= ENQUIRY POPUP ================= -->
<div id="enquirePopup" class="popup-overlay">
  <div class="popup-box glass-card">
    <span class="close-btn" onclick="closePopup('enquirePopup')">&times;</span>

    <h3 class="neon-text text-center mb-3">Workshop Enquiry</h3>

    <form id="enquiryForm">
      <div class="mb-3">
        <input type="text" name="fullname" class="form-control" placeholder="Full Name" required>
      </div>

      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email ID" required>
      </div>

      <div class="mb-3">
        <input type="tel" name="mobile" class="form-control" placeholder="Mobile Number" required>
      </div>

      <div class="mb-3">
        <input type="text" name="institute" class="form-control" placeholder="Institute / Organization">
      </div>

      <div class="mb-3">
        <input type="text" name="department" class="form-control" placeholder="Department">
      </div>

      <div class="mb-3">
        <input type="text" name="designation" class="form-control" placeholder="Designation">
      </div>

      <div class="mb-3">
        <select name="level" class="form-select">
          <option value="">Select Level</option>
          <option>UG</option>
          <option>PG</option>
          <option>Research Scholar</option>
          <option>Faculty</option>
          <option>Industry Job</option>
        </select>
      </div>

      <div class="mb-3">
        <input type="text" name="workshop" class="form-control" placeholder="Workshop Name">
      </div>

      <button type="submit" class="btn btn-neon w-100 rounded-pill">
        Submit Enquiry
      </button>
    </form>
  </div>
</div>

<!-- ================= REGISTER POPUP ================= -->
<div id="registerPopup" class="popup-overlay">
  <div class="popup-box glass-card">
    <span class="close-btn" onclick="closePopup('registerPopup')">&times;</span>

    <h3 class="neon-text text-center mb-3">Workshop Registration</h3>

    <form id="registerForm">
      <div class="mb-3">
        <input type="text" name="fullname" class="form-control" placeholder="Full Name" required>
      </div>

      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email ID" required>
      </div>

      <div class="mb-3">
        <input type="tel" name="mobile" class="form-control" placeholder="Mobile Number" required>
      </div>

      <div class="mb-3">
        <input type="text" name="institute" class="form-control" placeholder="Institute / Organization">
      </div>

      <div class="mb-3">
        <input type="text" name="department" class="form-control" placeholder="Department">
      </div>

      <div class="mb-3">
        <input type="text" name="designation" class="form-control" placeholder="Designation">
      </div>

      <div class="mb-3">
        <select name="level" class="form-select">
          <option value="">Select Level</option>
          <option>UG</option>
          <option>PG</option>
          <option>Research Scholar</option>
          <option>Faculty</option>
          <option>Industry Job</option>
        </select>
      </div>

      <div class="mb-3">
        <input type="text" name="workshop" class="form-control" placeholder="Workshop Name">
      </div>

      <div class="mb-3">
        <input type="text" name="fees" class="form-control" placeholder="Workshop Fees">
      </div>

      <button type="submit" class="btn btn-success w-100 rounded-pill">
        Complete Registration
      </button>
    </form>
  </div>
</div>
